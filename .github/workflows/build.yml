name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          tags: semubot-software:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          target: test
          tags: semubot-software:test
          load: true
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: firmware
          tags: semubot-software:firmware
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
